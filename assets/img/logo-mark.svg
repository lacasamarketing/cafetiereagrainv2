<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Piège à moustiques">
  <style>
    @keyframes leafSway { 0%,100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }
    @keyframes dotPulse { 0%,100% { transform: scale(1); opacity: 0.85; } 50% { transform: scale(1.25); opacity: 1; } }
    @keyframes haloBreath { 0%,100% { transform: scale(0.9); opacity: 0.45; } 50% { transform: scale(1.1); opacity: 0.85; } }
    .leaf { animation: leafSway 4s ease-in-out infinite; transform-origin: 32px 50px; }
    .dot  { animation: dotPulse 2.6s ease-in-out infinite; transform-origin: 32px 32px; transform-box: fill-box; }
    .halo { animation: haloBreath 3s ease-in-out infinite; transform-origin: 32px 32px; transform-box: fill-box; }
  </style>
  <circle cx="32" cy="32" r="26" fill="none" stroke="#1f5742" stroke-width="1.2" opacity="0.22"/>
  <circle class="halo" cx="32" cy="32" r="17" fill="none" stroke="#1f5742" stroke-width="1"/>
  <path class="leaf" d="M 32 14 C 22 22, 22 38, 32 46 C 42 38, 42 22, 32 14 Z" fill="#1f5742"/>
  <circle class="dot" cx="32" cy="32" r="3.2" fill="#c6e870"/>
</svg>
