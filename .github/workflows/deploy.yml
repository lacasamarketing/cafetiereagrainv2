name: Deploy to OVH mutualisé

on:
  push:
    branches: [main]
  workflow_dispatch:

# Annule les jobs precedents si nouveau push (evite les conflits FTP)
concurrency:
  group: deploy-ovh
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy via FTP to OVH
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate config.php from secrets
        run: |
          mkdir -p config
          cat > config/config.php <<'PHPEOF'
          <?php
          return [
              'env' => 'prod',
              'base_url' => 'https://cafetiereagrain.fr',
              'db' => [
                  'host' => '__DB_HOST__',
                  'name' => '__DB_NAME__',
                  'user' => '__DB_USER__',
                  'pass' => '__DB_PASS__',
                  'charset' => 'utf8mb4',
              ],
              'security' => [
                  'app_key' => '__APP_KEY__',
                  'session_lifetime' => 7200,
                  'max_login_attempts' => 5,
              ],
              'api_token' => '__API_TOKEN__',
              'anthropic_api_key' => '__ANTHROPIC_API_KEY__',
              'anthropic_model'   => 'claude-sonnet-4-6',
              'rainforest_api_key' => '__RAINFOREST_API_KEY__',
              'affiliate' => [
                  'amazon_tag'  => '__AMAZON_TAG__',
                  'amazon_base' => 'https://www.amazon.fr',
                  'awin_id'        => '',
                  'effiliation_id' => '',
              ],
              'admin_email' => 'bonjour@lacasamarketing.fr',
              'smtp' => [
                  'host' => '',
                  'port' => 587,
                  'user' => '',
                  'pass' => '',
                  'from_name'  => 'cafetiereagrain.fr',
                  'from_email' => 'noreply@cafetiereagrain.fr',
              ],
              'analytics' => [
                  'ga4_id' => '__GA4_ID__',
                  'gtm_id' => '',
                  'plausible_domain' => '__PLAUSIBLE_DOMAIN__',
              ],
          ];
          PHPEOF

          # Substitue les placeholders (pipe-delimiter pour eviter conflicts avec valeurs)
          sed -i "s|__DB_HOST__|${{ secrets.DB_HOST }}|g" config/config.php
          sed -i "s|__DB_NAME__|${{ secrets.DB_NAME }}|g" config/config.php
          sed -i "s|__DB_USER__|${{ secrets.DB_USER }}|g" config/config.php
          sed -i "s|__DB_PASS__|${{ secrets.DB_PASS }}|g" config/config.php

          # APP_KEY : fallback hash stable depuis repo_id
          APP_KEY="${{ secrets.APP_KEY }}"
          if [ -z "$APP_KEY" ]; then
            APP_KEY=$(echo -n "cgrain-appkey-${{ github.repository_id }}-v1" | sha256sum | cut -d' ' -f1)
          fi
          sed -i "s|__APP_KEY__|${APP_KEY}|g" config/config.php

          API_TOKEN="${{ secrets.API_TOKEN }}"
          [ -z "$API_TOKEN" ] && API_TOKEN="CHANGE_ME"
          sed -i "s|__API_TOKEN__|${API_TOKEN}|g" config/config.php

          ANTHROPIC_KEY="${{ secrets.ANTHROPIC_API_KEY }}"
          [ -z "$ANTHROPIC_KEY" ] && ANTHROPIC_KEY="sk-ant-CHANGEME"
          sed -i "s|__ANTHROPIC_API_KEY__|${ANTHROPIC_KEY}|g" config/config.php

          RAINFOREST_KEY="${{ secrets.RAINFOREST_API_KEY }}"
          [ -z "$RAINFOREST_KEY" ] && RAINFOREST_KEY="CHANGE_ME"
          sed -i "s|__RAINFOREST_API_KEY__|${RAINFOREST_KEY}|g" config/config.php

          AMAZON_TAG="${{ secrets.AMAZON_TAG }}"
          [ -z "$AMAZON_TAG" ] && AMAZON_TAG="lacasamarke08-21"
          sed -i "s|__AMAZON_TAG__|${AMAZON_TAG}|g" config/config.php

          GA4_ID="${{ secrets.GA4_ID }}"
          sed -i "s|__GA4_ID__|${GA4_ID}|g" config/config.php

          PLAUSIBLE="${{ secrets.PLAUSIBLE_DOMAIN }}"
          sed -i "s|__PLAUSIBLE_DOMAIN__|${PLAUSIBLE}|g" config/config.php

          echo "config/config.php genere OK ($(wc -l < config/config.php) lignes)"

      - name: Verify PHP syntax
        run: |
          # Test syntax sur tous les fichiers PHP avant deploiement
          find . -type f -name "*.php" \
            -not -path './_data/*' \
            -not -path './.git/*' \
            -not -path './node_modules/*' \
            -not -path './vendor/*' \
            -print0 | xargs -0 -n1 -P4 php -l > /tmp/phplint.log 2>&1 || true
          if grep -q "Errors parsing" /tmp/phplint.log; then
            echo "ERREUR de syntaxe PHP detectee :"
            grep -B1 "Errors parsing" /tmp/phplint.log
            exit 1
          fi
          echo "PHP syntax OK"

      - name: Preflight FTP connection test (fail fast)
        run: |
          echo "Test connexion FTP avant le gros upload..."
          # Test simple : list du dossier racine. Echec = credentials/path KO.
          curl -v --connect-timeout 10 --max-time 30 \
            --user "${{ secrets.FTP_USER }}:${{ secrets.FTP_PASSWORD }}" \
            "ftp://${{ secrets.FTP_HOST }}/" 2>&1 | head -50 || {
            echo "ECHEC CONNEXION FTP - verifier FTP_HOST, FTP_USER, FTP_PASSWORD"
            exit 1
          }
          echo "Connexion FTP OK"

      - name: Deploy via FTP to OVH
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ./
          protocol: ftp
          port: 21
          local-dir: ./
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/.github
            **/.github/**
            _data/
            _data/**
            _mockup-*.html
            _mockup-*
            **/node_modules/**
            **/.DS_Store
            **/*.md
            *.production
            scripts/build_import_sql.py
            database/*.sql
            index-full.php.backup
            .ftp-deploy-sync-state.json
          log-level: minimal
